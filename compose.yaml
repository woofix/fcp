services:
  fcp:
    build: .
    image: fcp:local
    container_name: ${FCP_CONTAINER:-fcp}
    restart: unless-stopped
    ports:
      - "${FCP_BIND_ADDRESS:-127.0.0.1}:${FCP_PORT:-9191}:9191"
    environment: &environment
      FCP_ADMIN_USER: ${FCP_ADMIN_USER:-admin}
      FCP_ADMIN_PASSWORD: ${FCP_ADMIN_PASSWORD:?Run python3 install.py first}
      FCP_FAIL2BAN_CONTAINER: ${FCP_FAIL2BAN_CONTAINER:-fail2ban}
      FCP_CONTAINER: ${FCP_CONTAINER:-fcp}
      FCP_HTTP_LOG: /app/logs/access.log
      TZ: ${TZ:-UTC}
    volumes: &volumes
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
      - ./geo:/app/geo
      - ./config:/app/config:ro
      - ./logs:/app/logs:ro
      - ./state:/app/automation-state
  automations:
    profiles: [automations]
    build: .
    image: fcp:local
    restart: unless-stopped
    command: [python, /app/automation/worker.py]
    healthcheck:
      disable: true
    environment: *environment
    volumes: *volumes
